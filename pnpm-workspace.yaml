catalogMode: 'strict'
shellEmulator: true

peerDependencyRules:
  ignoreMissing:
    - eslint-plugin-import
  allowAny:
    - eslint

minimumReleaseAgeExclude:
  - turbo
  - '@turbo/darwin-64'
  - '@turbo/darwin-arm64'
  - '@turbo/linux-64'
  - '@turbo/linux-arm64'
  - '@turbo/windows-64'
  - '@turbo/windows-arm64'

packages:
  - 'app'
  - 'docs'
  - 'supabase'

allowBuilds:
  '@swc/core': true
  'core-js': true
  'esbuild': true
  'unrs-resolver': true

catalog:
  '@types/node': ^26.6.2
  'typescript': ^6.0.3
  'tsx': ^4.23.15
  'rimraf': '^6.1.3'
  'turbo': 2.11.5
  'kill-port': '^2.0.1'
  '@types/unist': ^3.0.3
  'unified': ^11.0.5
  '@docusaurus/faster': ^3.10.2
  'dotenv': ^18.0.4

catalogs:
  tooling-stack:
    '@docusaurus/eslint-plugin': '3.10.2'
    '@eslint/js': '10.0.1'
    '@typescript-eslint/eslint-plugin': 8.70.1
    'eslint': 10.11.0
    'eslint-import-resolver-typescript': '4.4.5'
    'eslint-plugin-import-x': '^4.17.1'
    'eslint-plugin-mdx': '3.8.1'
    'eslint-plugin-prettier': '^5.5.6'
    'eslint-config-prettier': '^10.1.8'
    'prettier': 3.9.9
    'typescript-eslint': 8.70.1
    'eslint-plugin-react-hooks': ^7.1.1
    'globals': ^17.6.0
    'jiti': ^2.4.2

  web-stack:
    'clsx': '^2.1.1'
    '@gsap/react': '^2.1.2'
    'gsap': ^3.15.0
    'react': ^19.3.0
    'react-dom': ^19.3.0
    '@vitejs/plugin-react-swc': ^4.3.3
    '@types/react': ^19.3.0
    '@types/react-dom': ^19.3.0
    'vite': ^8.3.1
    '@eslint-react/eslint-plugin': ^5.20.8
    'eslint-plugin-react-refresh': ^0.5.7
    '@stripe/react-stripe-js': ^6.8.2
    '@stripe/stripe-js': ^9.15.0
    '@supabase/supabase-js': ^2.106.2
    '@tanstack/react-query': ^5.104.0
    'react-router-dom': ^7.15.1
    'react-icons': ^5.7.0

  shared-stack:
    'zod': ^4.6.5

  docs-stack:
    '@docusaurus/core': '3.10.2'
    '@docusaurus/preset-classic': '3.10.2'
    '@docusaurus/theme-live-codeblock': '3.10.2'
    '@docusaurus/theme-mermaid': '3.10.2'
    '@mdx-js/react': ^3.1.1
    'prism-react-renderer': ^2.4.1
    '@docusaurus/module-type-aliases': '3.10.2'
    '@docusaurus/tsconfig': '3.10.2'
    '@docusaurus/types': '3.10.2'
    '@docusaurus/utils': '3.10.2'
    '@docusaurus/plugin-content-docs': '3.10.2'
    '@docusaurus/plugin-content-blog': '3.10.2'
    '@docusaurus/plugin-content-pages': '3.10.2'
    '@docusaurus/plugin-debug': '3.10.2'
    '@docusaurus/plugin-google-gtag': '3.10.2'
    '@docusaurus/plugin-google-tag-manager': '3.10.2'
    '@docusaurus/plugin-sitemap': '3.10.2'
    '@docusaurus/plugin-svgr': '3.10.2'
    '@docusaurus/plugin-css-cascade-layers': '3.10.2'
    '@docusaurus/theme-classic': '3.10.2'
    '@docusaurus/theme-search-algolia': '3.10.2'
    '@docusaurus/theme-common': '3.10.2'
    'tailwindcss': ^4.3.3
    '@tailwindcss/postcss': ^4.3.3
